<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blip">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Blip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <span class="nav-title">Blip</span>
    <button id="settings" class="nav-action" type="button">Settings</button>
  </nav>

  <main class="wrap">
    <h1 class="large-title">Today</h1>
    <p id="date" class="subtitle"></p>

    <h2 class="section-head" id="today-head">Tasks</h2>
    <ul id="today" class="group"></ul>

    <section id="carry-section" hidden>
      <h2 class="section-head">Unfinished from before</h2>
      <ul id="carry" class="group"></ul>
    </section>
  </main>

  <div class="composer">
    <p id="status" role="status" aria-live="polite">Say or type a task</p>
    <form id="form" class="composer-inner" autocomplete="off">
      <div class="pill">
        <input id="input" type="text" placeholder="Add a task, or say “done with milk”" enterkeyhint="send">
        <button id="mic" type="button" class="mic" aria-label="Speak a task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
        </button>
      </div>
      <button id="send" type="submit" class="round send" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
