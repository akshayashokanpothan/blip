<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#EEEEF0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Blip">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Blip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar: menu on the left, logo centered -->
  <header class="topbar">
    <button id="menu" class="menu-btn" type="button" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">
      <svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true">
        <rect x="0" y="2" width="3.5" height="20" rx="1.75"/>
        <rect x="6.5" y="8" width="3.5" height="12" rx="1.75"/>
        <rect x="13" y="0" width="3.5" height="24" rx="1.75"/>
        <rect x="19.5" y="6" width="3.5" height="14" rx="1.75"/>
      </svg>
      <span>Blip</span>
    </div>
  </header>

  <main>
    <!-- Home: today's tasks -->
    <section id="view-home" class="view">
      <div class="hero">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M3.5 7l17 10M3.5 17l17-10M7 3.5l10 17M17 3.5l-10 17"/></svg>
        <h2 id="greeting" class="greeting">Good morning</h2>
      </div>
      <div class="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search tasks">
      </div>

      <div class="segmented" role="group" aria-label="Filter tasks">
        <button class="seg on" data-filter="all" type="button">All</button>
        <button class="seg" data-filter="open" type="button">Open</button>
        <button class="seg" data-filter="done" type="button">Done</button>
      </div>

      <p id="date" class="date"></p>
      <div class="card"><ul id="today" class="list"></ul></div>

      <section id="carry-section" hidden>
        <p class="section-label">Unfinished from before</p>
        <div class="card"><ul id="carry" class="list"></ul></div>
      </section>
    </section>

    <!-- Upcoming: placeholder for later -->
    <section id="view-upcoming" class="view" hidden>
      <p class="empty">Upcoming tasks will show here.</p>
    </section>

    <!-- Done: completed tasks across all days -->
    <section id="view-done" class="view" hidden>
      <div class="card"><ul id="done" class="list"></ul></div>
    </section>

    <!-- Settings -->
    <section id="view-settings" class="view" hidden>
      <div class="card">
        <p class="card-title">Theme</p>
        <div class="theme-grid" role="group" aria-label="Theme">
          <button class="theme-opt" data-theme-pick="classic" type="button" aria-pressed="false">
            <span class="swatch classic"></span><span>Classic</span>
          </button>
          <button class="theme-opt" data-theme-pick="modern" type="button" aria-pressed="false">
            <span class="swatch modern"></span><span>Modern</span>
          </button>
          <button class="theme-opt" data-theme-pick="claude" type="button" aria-pressed="false">
            <span class="swatch claude"></span><span>Claude</span>
          </button>
        </div>
      </div>
      <div class="card form">
        <label for="api-key">Anthropic API key</label>
        <input id="api-key" type="password" placeholder="Optional" autocomplete="off">
        <p id="mode-hint" class="hint"></p>
        <button id="save-key" class="pill-btn" type="button">Save key</button>
      </div>
      <div class="card">
        <button id="clear-data" class="row-btn danger" type="button">Delete all tasks</button>
      </div>
    </section>
  </main>

  <!-- Floating add button -->
  <button id="fab" class="fab" type="button" aria-label="Add a task">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Bottom tab bar -->
  <nav class="tabbar" aria-label="Main">
    <button class="tab on" data-tab="home" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg></span>
      <span class="label">Home</span>
    </button>
    <button class="tab" data-tab="upcoming" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span class="label">Upcoming</span>
    </button>
    <button class="tab" data-tab="done" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg></span>
      <span class="label">Done</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span>
      <span class="label">Settings</span>
    </button>
  </nav>

  <!-- Shared scrim for the drawer and the add sheet -->
  <div id="scrim" class="scrim"></div>

  <!-- Side menu -->
  <aside id="drawer" class="drawer" aria-label="Menu">
    <div class="profile">
      <div class="avatar" aria-hidden="true">B</div>
      <h2>Blip</h2>
      <p>Your day, in your voice</p>
      <span class="badge">Personal</span>
    </div>
    <div class="drawer-spacer"></div>
    <button class="drawer-item" data-drawer="report" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"/><path d="M12 8v4M12 15h0"/></svg>Report an issue
    </button>
    <button class="drawer-item" data-drawer="feedback" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 8h8M8 12h5"/></svg>Share feedback
    </button>
    <div class="divider"></div>
    <button class="drawer-item" data-drawer="themes" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="16" cy="10" r="1.2"/></svg>Themes
    </button>
    <button class="drawer-item" data-drawer="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings
    </button>
  </aside>

  <!-- Add-task sheet -->
  <section id="sheet" class="sheet" aria-label="Add tasks">
    <div class="grab" aria-hidden="true"></div>
    <textarea id="input" placeholder="Say or type what’s on your day…" rows="3"></textarea>
    <div class="sheet-actions">
      <button id="mic" class="mic-big" type="button" aria-label="Speak">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
      </button>
      <button id="add-btn" class="add-btn" type="button">Add</button>
    </div>
  </section>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="app.js"></script>
</body>
</html>
